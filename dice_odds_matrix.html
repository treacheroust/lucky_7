<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>Bobblehead Winning Odds</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      padding: max(18px, env(safe-area-inset-top)) 14px max(18px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at top, #243b67, #0f172a 48%);
    }
    main { width: min(100%, 1740px); margin: 0 auto; }
    h1 { margin: 0; font-size: clamp(1.55rem, 5vw, 2.2rem); }
    .subtitle { margin: 6px 0 14px; color: #cbd5e1; }
    .summary {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px 18px;
      margin-bottom: 14px;
      padding: 12px 14px;
      border: 1px solid #3f4f67;
      border-radius: 12px;
      background: rgb(15 23 42 / 82%);
    }
    .best-summary { color: #86efac; font-weight: 800; }
    .formula { color: #94a3b8; font-size: .85rem; }
    .legend { display: flex; align-items: center; gap: 8px; margin-left: auto; color: #cbd5e1; font-size: .78rem; }
    .legend-bar {
      width: 120px;
      height: 10px;
      border: 1px solid #475569;
      border-radius: 999px;
      background: linear-gradient(90deg, hsl(210 70% 16%), hsl(45 70% 48%));
    }
    .matrix-wrap {
      max-height: calc(100vh - 190px);
      overflow: auto;
      border: 1px solid #475569;
      border-radius: 14px;
      background: #111827;
      box-shadow: 0 18px 50px rgb(0 0 0 / 28%);
      overscroll-behavior: contain;
    }
    table {
      width: max-content;
      min-width: 100%;
      border-spacing: 0;
      border-collapse: separate;
      font-variant-numeric: tabular-nums;
    }
    th, td {
      width: 76px;
      min-width: 76px;
      height: 44px;
      padding: 8px 7px;
      border-right: 1px solid rgb(148 163 184 / 18%);
      border-bottom: 1px solid rgb(148 163 184 / 18%);
      text-align: center;
      white-space: nowrap;
    }
    thead th {
      position: sticky;
      top: 0;
      z-index: 3;
      background: #0b1220;
      color: #fbbf24;
      font-size: .8rem;
      font-weight: 850;
    }
    .corner {
      left: 0;
      z-index: 5;
      width: 94px;
      min-width: 94px;
      color: #cbd5e1;
      font-size: .65rem;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: .04em;
    }
    tbody th {
      position: sticky;
      left: 0;
      z-index: 2;
      width: 94px;
      min-width: 94px;
      background: #0b1220;
      color: #fbbf24;
      font-weight: 850;
      box-shadow: 2px 0 0 rgb(71 85 105 / 70%);
    }
    td {
      position: relative;
      font-size: .79rem;
      font-weight: 750;
    }
    td.best {
      z-index: 1;
      outline: 3px solid #22c55e;
      outline-offset: -3px;
      box-shadow: inset 0 0 0 1px #bbf7d0;
    }
    .best-tag {
      position: absolute;
      top: 2px;
      right: 3px;
      padding: 1px 4px;
      border-radius: 4px;
      background: #22c55e;
      color: #052e16;
      font-size: .46rem;
      font-weight: 950;
      letter-spacing: .03em;
    }
    tr:last-child th, tr:last-child td { border-bottom: 0; }
    th:last-child, td:last-child { border-right: 0; }
    @media (max-width: 600px) {
      body { padding-inline: 10px; }
      .subtitle { font-size: .9rem; }
      .summary { gap: 6px; padding: 10px 11px; }
      .formula { width: 100%; }
      .legend { width: 100%; margin-left: 0; }
      .matrix-wrap { max-height: calc(100vh - 230px); border-radius: 10px; }
      th, td { width: 70px; min-width: 70px; height: 42px; padding: 7px 5px; }
      .corner, tbody th { width: 78px; min-width: 78px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Winning Odds Matrix</h1>
    <p class="subtitle">Chance of finishing with exactly seven 6s.</p>

    <section class="summary" aria-label="Best odds and heatmap legend">
      <span id="bestSummary" class="best-summary"></span>
      <span class="formula">Rows: bobbleheads · Columns: dice per group</span>
      <span class="legend"><span>Lower</span><span class="legend-bar"></span><span>Higher</span></span>
    </section>

    <div class="matrix-wrap" tabindex="0" aria-label="Scrollable winning odds matrix">
      <table id="oddsTable">
        <thead></thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <script>
    const MIN_BOBBLEHEADS = 7;
    const MAX_BOBBLEHEADS = 50;
    const MIN_GROUP_SIZE = 1;
    const MAX_GROUP_SIZE = 20;
    const TARGET_SIXES = 7;

    function combinations(n, k) {
      let result = 1;
      for (let i = 1; i <= k; i += 1) {
        result = result * (n - k + i) / i;
      }
      return result;
    }

    function winningProbability(bobbleheads, groupSize) {
      const sixChance = 1 - (5 / 6) ** groupSize;
      return combinations(bobbleheads, TARGET_SIXES)
        * sixChance ** TARGET_SIXES
        * (1 - sixChance) ** (bobbleheads - TARGET_SIXES);
    }

    const cells = [];
    let best = { probability: -1, bobbleheads: 0, groupSize: 0 };

    for (let bobbleheads = MIN_BOBBLEHEADS; bobbleheads <= MAX_BOBBLEHEADS; bobbleheads += 1) {
      for (let groupSize = MIN_GROUP_SIZE; groupSize <= MAX_GROUP_SIZE; groupSize += 1) {
        const probability = winningProbability(bobbleheads, groupSize);
        cells.push({ bobbleheads, groupSize, probability });
        if (probability > best.probability) {
          best = { probability, bobbleheads, groupSize };
        }
      }
    }

    const table = document.querySelector("#oddsTable");
    const headerRow = document.createElement("tr");
    const corner = document.createElement("th");
    corner.className = "corner";
    corner.scope = "col";
    corner.innerHTML = "Bobbleheads ↓<br>Group size →";
    headerRow.append(corner);

    for (let groupSize = MIN_GROUP_SIZE; groupSize <= MAX_GROUP_SIZE; groupSize += 1) {
      const header = document.createElement("th");
      header.scope = "col";
      header.textContent = groupSize;
      headerRow.append(header);
    }
    table.tHead.append(headerRow);

    for (let bobbleheads = MIN_BOBBLEHEADS; bobbleheads <= MAX_BOBBLEHEADS; bobbleheads += 1) {
      const row = document.createElement("tr");
      const rowHeader = document.createElement("th");
      rowHeader.scope = "row";
      rowHeader.textContent = bobbleheads;
      row.append(rowHeader);

      for (let groupSize = MIN_GROUP_SIZE; groupSize <= MAX_GROUP_SIZE; groupSize += 1) {
        const entry = cells.find((cell) => cell.bobbleheads === bobbleheads && cell.groupSize === groupSize);
        const percent = entry.probability * 100;
        const intensity = entry.probability / best.probability;
        const hue = 210 - 165 * intensity;
        const lightness = 16 + 32 * intensity;
        const cell = document.createElement("td");
        cell.textContent = `${percent.toFixed(2)}%`;
        cell.style.backgroundColor = `hsl(${hue} 70% ${lightness}%)`;
        cell.style.color = intensity > 0.62 ? "#1c1917" : "#f8fafc";
        cell.title = `${bobbleheads} bobbleheads, group size ${groupSize}: ${percent.toFixed(6)}%`;

        if (bobbleheads === best.bobbleheads && groupSize === best.groupSize) {
          cell.className = "best";
          const tag = document.createElement("span");
          tag.className = "best-tag";
          tag.textContent = "BEST";
          cell.append(tag);
        }
        row.append(cell);
      }
      table.tBodies[0].append(row);
    }

    document.querySelector("#bestSummary").textContent =
      `Best: ${best.bobbleheads} bobbleheads × ${best.groupSize} dice = ${(best.probability * 100).toFixed(2)}%`;
  </script>
</body>
</html>
