<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16213e">
  <title>Bobblehead Dice Roller</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #0f172a;
      color: #f8fafc;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: start center;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(circle at top, #243b67, #0f172a 55%);
    }
    main {
      width: min(100%, 520px);
      background: rgb(15 23 42 / 88%);
      border: 1px solid #334155;
      border-radius: 20px;
      padding: 22px;
      box-shadow: 0 18px 50px rgb(0 0 0 / 35%);
    }
    h1 { margin: 0 0 6px; font-size: 1.65rem; }
    .hint { margin: 0 0 22px; color: #cbd5e1; }
    .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    label { color: #cbd5e1; font-weight: 650; }
    input {
      width: 100%;
      margin-top: 6px;
      padding: 12px;
      border: 1px solid #475569;
      border-radius: 10px;
      background: #111827;
      color: white;
      font: inherit;
      font-size: 1.1rem;
    }
    button {
      width: 100%;
      margin-top: 16px;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: #f59e0b;
      color: #1c1917;
      font: inherit;
      font-size: 1.1rem;
      font-weight: 800;
      cursor: pointer;
      touch-action: manipulation;
    }
    button:active { transform: translateY(1px); background: #fbbf24; }
    #results { margin-top: 22px; }
    #results h2 { margin: 0 0 10px; font-size: 1.1rem; color: #cbd5e1; }
    .attempt-table {
      overflow: hidden;
      border: 1px solid #334155;
      border-radius: 14px;
      background: #111827;
    }
    .attempt-header,
    .attempt summary {
      display: grid;
      grid-template-columns: 34px minmax(0, 1fr) 42px auto 14px;
      gap: 8px;
      align-items: center;
    }
    .attempt-header {
      padding: 9px 12px;
      background: #0b1220;
      color: #94a3b8;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .attempt-header span:last-child { grid-column: 4 / 6; }
    .attempt + .attempt { border-top: 1px solid #334155; }
    .attempt summary {
      position: relative;
      min-height: 58px;
      padding: 11px 12px;
      cursor: pointer;
      list-style: none;
      transition: background .15s ease;
    }
    .attempt summary::-webkit-details-marker { display: none; }
    .attempt summary:hover { background: #1e293b; }
    .attempt[open] summary { background: #1e293b; }
    .attempt.winner summary { background: linear-gradient(90deg, rgb(34 197 94 / 14%), rgb(30 41 59 / 75%)); }
    .attempt-number { color: #fbbf24; font-weight: 850; }
    .dice-row {
      color: #f8fafc;
      font-variant-numeric: tabular-nums;
      line-height: 1.45;
      overflow-wrap: normal;
    }
    .six-count {
      color: #e2e8f0;
      font-size: .95rem;
      font-weight: 800;
      text-align: center;
    }
    .win {
      justify-self: start;
      padding: 4px 9px;
      border-radius: 999px;
      background: #22c55e;
      color: #052e16;
      font-size: .73rem;
      font-weight: 900;
      letter-spacing: .03em;
    }
    .chevron {
      color: #94a3b8;
      font-size: .8rem;
      transition: transform .15s ease;
    }
    .attempt[open] .chevron { transform: rotate(90deg); }
    .attempt-details {
      padding: 12px 14px 16px;
      border-top: 1px solid #334155;
      background: #151f31;
    }
    .attempt-total { margin: 0 0 8px; color: #cbd5e1; font-weight: 700; }
    .group-title { margin: 0; color: #94a3b8; font-size: .78rem; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; }
    .attempt-details ol { margin-top: 6px; }
    .attempt-details li { line-height: 1.45; }
    .attempt-details li::marker { color: #64748b; }
    .kept {
      color: white;
      font-weight: 750;
    }
    ol { padding-left: 30px; margin-bottom: 0; }
    li { padding: 6px 0; color: #cbd5e1; }
    [hidden] { display: none; }
    @media (max-width: 600px) {
      main { padding: 18px; }
      .inputs { grid-template-columns: 1fr; }
      .attempt-header,
      .attempt summary { grid-template-columns: 24px minmax(64px, 1fr) 30px auto 12px; gap: 6px; }
      .attempt-header { padding-inline: 9px; font-size: .62rem; }
      .attempt summary { padding-inline: 9px; }
      .six-count { font-size: .78rem; }
      .win { padding-inline: 7px; font-size: .65rem; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Bobblehead Dice Roller</h1>
    <p class="hint">Roll each group of d6s and keep its highest die.</p>

    <form id="roller">
      <div class="inputs">
        <label>
          Dice per group
          <input id="extraDice" name="extraDice" type="number" min="1" max="1000" value="2" required inputmode="numeric">
        </label>
        <label>
          Bobbleheads (groups)
          <input id="bobbleheads" name="bobbleheads" type="number" min="1" max="1000" value="5" required inputmode="numeric">
        </label>
      </div>
      <button type="submit">Roll dice</button>
    </form>

    <section id="results" aria-live="polite" hidden>
      <h2>Attempts</h2>
      <div class="attempt-table">
        <div class="attempt-header" aria-hidden="true">
          <span>Try</span>
          <span>Kept dice</span>
          <span>Sixes</span>
          <span>Result</span>
        </div>
        <div id="attempts"></div>
      </div>
    </section>
  </main>

  <script>
    const form = document.querySelector("#roller");
    const results = document.querySelector("#results");
    const attempts = document.querySelector("#attempts");
    let attemptNumber = 0;

    function rollD6() {
      return Math.floor(Math.random() * 6) + 1;
    }

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!form.reportValidity()) return;

      const extraDice = Number(form.elements.extraDice.value);
      const bobbleheads = Number(form.elements.bobbleheads.value);
      const groups = [];
      const kept = [];

      for (let groupNumber = 0; groupNumber < bobbleheads; groupNumber += 1) {
        const rolls = Array.from({ length: extraDice }, rollD6);
        groups.push(rolls);
        kept.push(Math.max(...rolls));
      }

      const numberOfSixes = kept.filter((roll) => roll === 6).length;
      attemptNumber += 1;

      const attempt = document.createElement("details");
      attempt.className = `attempt${numberOfSixes === 7 ? " winner" : ""}`;

      const summary = document.createElement("summary");
      const attemptLabel = document.createElement("span");
      attemptLabel.className = "attempt-number";
      attemptLabel.textContent = attemptNumber;

      const diceRow = document.createElement("span");
      diceRow.className = "dice-row";
      diceRow.textContent = kept.join(", ");
      diceRow.setAttribute("aria-label", `Kept dice: ${kept.join(", ")}`);

      const sixCount = document.createElement("span");
      sixCount.className = "six-count";
      sixCount.textContent = numberOfSixes;
      sixCount.setAttribute("aria-label", `${numberOfSixes} ${numberOfSixes === 1 ? "six" : "sixes"}`);

      const result = document.createElement("span");
      if (numberOfSixes === 7) {
        result.className = "win";
        result.textContent = "WINNER!";
      }

      const chevron = document.createElement("span");
      chevron.className = "chevron";
      chevron.textContent = "▶";
      chevron.setAttribute("aria-hidden", "true");
      summary.append(attemptLabel, diceRow, sixCount, result, chevron);

      const attemptDetails = document.createElement("div");
      attemptDetails.className = "attempt-details";
      const total = document.createElement("p");
      total.className = "attempt-total";
      total.textContent = `Total: ${kept.reduce((sum, roll) => sum + roll, 0)}`;
      const groupTitle = document.createElement("p");
      groupTitle.className = "group-title";
      groupTitle.textContent = "All roll groups";
      const rollLog = document.createElement("ol");
      rollLog.append(...groups.map((rolls, index) => {
        const item = document.createElement("li");
        const highest = Math.max(...rolls);
        item.append(`Group ${index + 1}: [${rolls.join(", ")}] → `);
        const keptLabel = document.createElement("span");
        keptLabel.className = "kept";
        keptLabel.textContent = `kept ${highest}`;
        item.append(keptLabel);
        return item;
      }));

      attemptDetails.append(total, groupTitle, rollLog);
      attempt.append(summary, attemptDetails);
      attempts.append(attempt);

      results.hidden = false;
    });
  </script>
</body>
</html>
